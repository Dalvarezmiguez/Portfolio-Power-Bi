name: Informe semanal de tráfico con comparativa y gráficos mejorados

on:
  schedule:
    - cron: '0 9 * * 1'  # Cada lunes a las 9 AM UTC
  workflow_dispatch:

jobs:
  traffic_report:
    runs-on: ubuntu-latest
    steps:

      # 1️⃣ Checkout del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      # 2️⃣ Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 3️⃣ Instalar librerías
      - name: Instalar librerías
        run: pip install requests matplotlib

      # 4️⃣ Ejecutar script de tráfico mejorado
      - name: Ejecutar script de tráfico
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: Dalvarezmiguez/Portfolio-Power-Bi
        run: python .github/scripts/traffic_report_pro.py

      # 5️⃣ Leer contenido HTML generado por el script
      - name: Leer contenido HTML
        id: leer_html
        run: |
          echo "html_body<<EOF" >> $GITHUB_ENV
          cat traffic-report.html >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 6️⃣ Enviar informe por correo con gráficos adjuntos
      - name: Enviar informe por correo
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Informe semanal de tráfico del repo"
          to: ${{ secrets.EMAIL_ADDRESS }}
          from: ${{ secrets.EMAIL_ADDRESS }}
          html_body: ${{ env.html_body }}
          attachments: visitas.png,clones.png
