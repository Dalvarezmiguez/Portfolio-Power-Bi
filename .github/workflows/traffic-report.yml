name: Enviar informe semanal

on:
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v3

      - name: Enviar informe por correo
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Informe semanal de tráfico del repo"
          to: ${{ secrets.EMAIL_ADDRESS }}
          from: ${{ secrets.EMAIL_ADDRESS }}
          html_body: ${{ steps.read_html.outputs.html_content }}

      - name: Leer archivo HTML
        id: read_html
        run: |
          html_content=$(cat traffic-report.html)
          echo "::set-output name=html_content::$html_content"
