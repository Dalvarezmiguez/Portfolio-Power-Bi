name: Enviar informe semanal

on:
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v3

      - name: Enviar informe por correo
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_ADDRESS }}    # Tu correo
          password: ${{ secrets.EMAIL_PASSWORD }}   # Tu App Password
          subject: "Informe semanal de tráfico del repo"
          to: ${{ secrets.EMAIL_ADDRESS }}         # Destinatario
          from: ${{ secrets.EMAIL_ADDRESS }}       # Remitente (debe coincidir con tu correo)
          body: ${{ steps.read_html.outputs.content }}  # Contenido del HTML
          body_type: html

      - name: Leer archivo HTML
        id: read_html
        run: |
          echo "content<<EOF" >> $GITHUB_ENV
          cat traffic-report.html >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
