name: Enviar informe semanal

on:
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Leer contenido HTML
        id: leer_html
        run: |
          contenido=$(cat traffic-report.html)
          echo "html_body<<EOF" >> $GITHUB_ENV
          echo "$contenido" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Enviar informe por correo
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Informe semanal de tráfico del repo"
          to: ${{ secrets.EMAIL_ADDRESS }}
          from: ${{ secrets.EMAIL_ADDRESS }}
          html_body: ${{ env.html_body }}
