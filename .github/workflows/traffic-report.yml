name: Informe semanal de tráfico con comparativa y gráfico diario

on:
  schedule:
    - cron: '0 9 * * 1' # Cada lunes a las 9 AM UTC
  workflow_dispatch:

jobs:
  traffic_report:
    runs-on: ubuntu-latest
    steps:

      # 1️⃣ Checkout del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      # 2️⃣ Debug: listar todos los archivos del repo
      - name: Listar archivos para debug
        run: ls -R

      # 3️⃣ Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 4️⃣ Instalar requests y ejecutar script
      - name: Ejecutar script de tráfico
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: Dalvarezmiguez/Portfolio-Power-Bi
        run: |
          pip install requests
          python .github/scripts/traffic_report.py

      # 5️⃣ Debug: comprobar que el HTML se creó
      - name: Listar HTML generado
        run: ls -l traffic-report.html

      # 6️⃣ Enviar informe por correo
      - name: Enviar informe por correo
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_ADDRESS }}      # obligatorio
          to: ${{ secrets.EMAIL_ADDRESS }}
          subject: "Informe semanal de tráfico del repo"
          html_body: |
            $(cat traffic-report.html)
